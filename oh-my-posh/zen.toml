#:schema https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

version = 2
final_space = true
console_title_template = '{{ .Shell }} in {{ .Folder }}'

# ─── Catppuccin Macchiato palette ──────────────────────────────────
[palette]
  rosewater = '#ddc7a1'
  flamingo  = '#ea6962'
  pink      = '#d3869b'
  mauve     = '#d3869b'
  red       = '#ea6962'
  maroon    = '#ea6962'
  peach     = '#e78a4e'
  yellow    = '#d8a657'
  green     = '#a9b665'
  teal      = '#89b482'
  sky       = '#89b482'
  sapphire  = '#7daea3'
  blue      = '#7daea3'
  lavender  = '#d3869b'
  text      = '#d4be98'
  subtext1  = '#d4be98'
  subtext0  = '#ddc7a1'
  overlay2  = '#a89984'
  overlay1  = '#928374'
  overlay0  = '#7c6f64'
  surface2  = '#5a524c'
  surface1  = '#45403d'
  surface0  = '#32302f'
  base      = '#282828'
  mantle    = '#1d2021'
  crust     = '#1d2021'

# ─── Line 1: ╭─ path  git  project_version ─────────────────────────
[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'text'
    style = 'plain'
    background = 'transparent'
    foreground = 'p:overlay0'
    template = '<b>╭─ </b>'

  [[blocks.segments]]
    type = 'path'
    style = 'plain'
    background = 'transparent'
    foreground = 'p:blue'
    template = '{{ .Path }}'

    [blocks.segments.properties]
      style = 'full'

  [[blocks.segments]]
    type = 'git'
    style = 'plain'
    background = 'transparent'
    foreground = 'p:yellow'
    template = ' (<p:yellow>{{ .HEAD }}</>{{ if or .Working.Changed .Staging.Changed (gt .Behind 0) (gt .Ahead 0) }} {{ end }}{{ if .Staging.Changed }}<p:green>+</>{{ end }}{{ if and .Working.Changed (eq .Working.Untracked .Working.Modified) }}<p:peach>!</>{{ else }}{{ if .Working.Modified }}<p:peach>!</>{{ end }}{{ end }}{{ if gt .Working.Untracked 0 }}<p:blue>?</>{{ end }}{{ if gt .StashCount 0 }}<p:mauve>*{{ .StashCount }}</>{{ end }}{{ if gt .Ahead 0 }}<p:green>↑{{ .Ahead }}</>{{ end }}{{ if gt .Behind 0 }}<p:red>↓{{ .Behind }}</>{{ end }}<p:yellow>)</>'

    [blocks.segments.properties]
      branch_icon = ''
      commit_icon = '@'
      fetch_status = true
      fetch_stash_count = true


# ─── Right prompt: command duration ────────────────────────────────
[[blocks]]
  type = 'rprompt'
  overflow = 'hidden'

  [[blocks.segments]]
    type = 'executiontime'
    style = 'plain'
    background = 'transparent'
    foreground = 'p:yellow'
    template = '{{ .FormattedMs }}'

    [blocks.segments.properties]
      threshold = 1000
      style = 'austin'

# ─── Line 2: ╰─❯ prompt symbol ────────────────────────────────────
[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'text'
    style = 'plain'
    background = 'transparent'
    foreground = 'p:overlay0'
    template = '<b>╰─</b>'

  [[blocks.segments]]
    type = 'text'
    style = 'plain'
    background = 'transparent'
    foreground_templates = [
      "{{if gt .Code 0}}p:red{{end}}",
      "{{if eq .Code 0}}p:mauve{{end}}",
    ]
    template = '❯'

[transient_prompt]
  background = 'transparent'
  foreground = 'p:mauve'
  template = '<b><p:overlay0>╰─</p:overlay0></b>❯ '

[secondary_prompt]
  background = 'transparent'
  foreground = 'p:mauve'
  template = '❯❯ '

# Default-shell uses $SHELL (set by `chsh -s $(which zsh)` — install.sh handles this)
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

unbind C-b
set -g prefix C-s
bind C-s send-prefix

set -g mouse on
set -s escape-time 0
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g focus-events on
set -g status-position top
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 120
# Ensure default status-format (in case a prior override is sticking in memory)
set -u -g status-format
# Theme palette (managed by scripts/set-theme.sh)
set -g status-style "bg=#1d2021,fg=#d4be98"
# Session pill flips green→yellow while the prefix (Ctrl+s) is armed
set -g status-left "#[fg=#1d2021,bg=#{?client_prefix,#d8a657,#a9b665},bold]  #S #[fg=#{?client_prefix,#d8a657,#a9b665},bg=#1d2021] "
set -g status-right "#[fg=#d3869b]#(playerctl --player='chromium,firefox,chrome,brave,zen' metadata --format ' {{title}} · {{artist}}' 2>/dev/null | cut -c -50) #[fg=#d3869b] #{pane_current_command} #[fg=#7daea3]  %a %b %d #[fg=#d8a657]  %H:%M "
set -g pane-border-style "fg=#45403d"
set -g pane-active-border-style "fg=#7daea3"
set -g message-style "bg=#282828,fg=#d4be98"
setw -g window-status-current-format "#[fg=#1d2021,bg=#7daea3,bold]  #I:#W#{?window_zoomed_flag,  ,} #[fg=#7daea3,bg=#1d2021]"
setw -g window-status-format " #[fg=#7c6f64]#I:#W "
set -g mode-style "bg=#32302f,fg=#d4be98"

bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n C-Left previous-window
bind -n C-Right next-window

# Scratchpads — floating popups
# Border colors identify the overlay: green=git, orange=btop, red=redthread,
# purple=music, yellow=nock, paper=notes; everything else keeps the default teal.
set -g popup-border-style "fg=#7daea3"
set -g popup-border-lines rounded
bind g display-popup -E -S "fg=#a9b665" -w 90% -h 85% -d "#{pane_current_path}" "lazygit"
bind t display-popup -E -w 60% -h 60% -d "#{pane_current_path}" "zsh -l"
bind f display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "zsh -ic \"fzf --preview 'bat --style=numbers --color=always {}' | xargs -r nvim\""
bind / display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "zsh -ic '$HOME/code/personal/dotfiles/scripts/rg-nvim.sh'"
bind n display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "glow"
bind b display-popup -E -S "fg=#e78a4e" -w 80% -h 70% "btop"
bind e display-popup -E -S "fg=#ea6962" -w 85% -h 80% -d "#{pane_current_path}" "zsh -ic 'redthread'"
bind F display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "zsh -ic 'elio'"
bind q display-popup -E -w 45% -h 45% -y 1 "$HOME/code/personal/dotfiles/scripts/tmux-quota.sh"
bind S display-popup -E -S "fg=#d3869b" -w 42% -h 52% "zsh -ic 'songfetch; read -k 1 -s'"
bind P display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "zsh -ic 'fd -e md | fzf --reverse --preview \"bat --color=always --style=plain {}\" | xargs -r $HOME/code/personal/dotfiles/scripts/slides-auto.sh'"

# Scrollback pickers — act on what already scrolled past
unbind .   # default move-window prompt, unused
bind . display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "$HOME/code/personal/dotfiles/scripts/tmux-path-picker.sh"
bind y display-popup -E -w 75% -h 50% "$HOME/code/personal/dotfiles/scripts/tmux-url-picker.sh"

# Per-project notes — nvim on ~/notes/<session>.md (n reads with glow, N writes)
bind N display-popup -E -S "fg=#d4be98" -w 80% -h 80% "$HOME/code/personal/dotfiles/scripts/tmux-notes.sh"

# nock — pinned command palette (a: run, A: pin)
bind a display-popup -E -S "fg=#d8a657" -w 60% -h 60% "$HOME/code/personal/dotfiles/scripts/nock.sh menu"
bind A display-popup -E -S "fg=#d8a657" -w 70% -h 70% "$HOME/code/personal/dotfiles/scripts/nock.sh add"

# Music controls — targets browser MPRIS players (YouTube Music etc.)
bind -n M-p run-shell "playerctl --player='chromium,firefox,chrome,brave,zen' play-pause"
bind -n M-. run-shell "playerctl --player='chromium,firefox,chrome,brave,zen' next"
bind -n M-, run-shell "playerctl --player='chromium,firefox,chrome,brave,zen' previous"
bind m display-menu -x R -y S -T "#[fg=#d3869b,bold] music" \
  "play / pause"  p "run-shell \"playerctl --player='chromium,firefox,chrome,brave,zen' play-pause\"" \
  "next"          n "run-shell \"playerctl --player='chromium,firefox,chrome,brave,zen' next\"" \
  "previous"      b "run-shell \"playerctl --player='chromium,firefox,chrome,brave,zen' previous\"" \
  "" \
  "vol +5"        "=" "run-shell \"playerctl --player='chromium,firefox,chrome,brave,zen' volume 0.05+\"" \
  "vol -5"        -   "run-shell \"playerctl --player='chromium,firefox,chrome,brave,zen' volume 0.05-\""

# Cheat sheet — section colors match the popup border coding
bind ? display-menu -x R -y S -T "#[fg=#7daea3,bold] keybindings" \
  "" \
  "-#[fg=#7c6f64]──#[fg=#7daea3,bold] find #[fg=#7c6f64,nobold]──────────────────" "" "" \
  "find file → nvim"    f "display-popup -E -w 90% -h 85% -d '#{pane_current_path}' \"fzf --preview 'bat --style=numbers --color=always {}' | xargs -r nvim\"" \
  "live grep → nvim"    / "display-popup -E -w 90% -h 85% -d '#{pane_current_path}' \"zsh -ic '$HOME/code/personal/dotfiles/scripts/rg-nvim.sh'\"" \
  "scrollback paths"    . "display-popup -E -w 90% -h 85% -d '#{pane_current_path}' '$HOME/code/personal/dotfiles/scripts/tmux-path-picker.sh'" \
  "scrollback urls"     y "display-popup -E -w 75% -h 50% '$HOME/code/personal/dotfiles/scripts/tmux-url-picker.sh'" \
  "elio file manager"   F "display-popup -E -w 90% -h 85% -d '#{pane_current_path}' \"zsh -ic 'elio'\"" \
  "-#[fg=#7c6f64]──#[fg=#a9b665,bold] tools #[fg=#7c6f64,nobold]─────────────────" "" "" \
  "lazygit"             g "display-popup -E -S 'fg=#a9b665' -w 90% -h 85% -d '#{pane_current_path}' 'lazygit'" \
  "terminal"            t "display-popup -E -w 60% -h 60% -d '#{pane_current_path}' 'zsh -l'" \
  "btop"                b "display-popup -E -S 'fg=#e78a4e' -w 80% -h 70% 'btop'" \
  "redthread"           e "display-popup -E -S 'fg=#ea6962' -w 85% -h 80% -d '#{pane_current_path}' \"zsh -ic 'redthread'\"" \
  "claude/codex quota"  q "display-popup -E -w 45% -h 45% -y 1 '$HOME/code/personal/dotfiles/scripts/tmux-quota.sh'" \
  "-#[fg=#7c6f64]──#[fg=#e78a4e,bold] markdown #[fg=#7c6f64,nobold]──────────────" "" "" \
  "glow browser"        n "display-popup -E -w 80% -h 70% -d '#{pane_current_path}' 'glow'" \
  "project notes"       N "display-popup -E -S 'fg=#d4be98' -w 80% -h 80% '$HOME/code/personal/dotfiles/scripts/tmux-notes.sh'" \
  "present slides"      P "display-popup -E -w 80% -h 80% -d '#{pane_current_path}' \"zsh -ic 'fd -e md | fzf --reverse --preview \\\"bat --color=always --style=plain {}\\\" | xargs -r $HOME/code/personal/dotfiles/scripts/slides-auto.sh'\"" \
  "-#[fg=#7c6f64]──#[fg=#d8a657,bold] nock #[fg=#7c6f64,nobold]──────────────────" "" "" \
  "run pinned"          a "display-popup -E -S 'fg=#d8a657' -w 60% -h 60% '$HOME/code/personal/dotfiles/scripts/nock.sh menu'" \
  "pin command(s)"      A "display-popup -E -S 'fg=#d8a657' -w 70% -h 70% '$HOME/code/personal/dotfiles/scripts/nock.sh add'" \
  "-#[fg=#7c6f64]──#[fg=#d3869b,bold] music #[fg=#7c6f64,nobold]─────────────────" "" "" \
  "play / pause"        "M-p" "run-shell \"playerctl --player='chromium,firefox,chrome,brave,zen' play-pause\"" \
  "next track"          "M-." "run-shell \"playerctl --player='chromium,firefox,chrome,brave,zen' next\"" \
  "previous track"      "M-," "run-shell \"playerctl --player='chromium,firefox,chrome,brave,zen' previous\"" \
  "volume menu"         m "display-menu -x R -y S -T '#[fg=#d3869b,bold] volume' 'vol +5' = \"run-shell 'playerctl volume 0.05+'\" 'vol -5' - \"run-shell 'playerctl volume 0.05-'\"" \
  "songfetch (spotify)" S "display-popup -E -S 'fg=#d3869b' -w 55% -h 55% \"zsh -ic 'songfetch; read -k 1 -s'\"" \
  "-#[fg=#7c6f64]──#[fg=#a89984,bold] panes · windows #[fg=#7c6f64,nobold]───────" "" "" \
  "split vertical"      "|" "split-window -h -c '#{pane_current_path}'" \
  "split horizontal"    -   "split-window -v -c '#{pane_current_path}'" \
  "zoom toggle"         z   "resize-pane -Z" \
  "kill pane"           x   "confirm-before -p 'kill pane? (y/n)' kill-pane" \
  "cycle layouts"       Space "next-layout" \
  "new window"          c   "new-window -c '#{pane_current_path}'" \
  "rename window"       ,   "command-prompt -I '#W' 'rename-window %%'" \
  "kill window"         "&" "confirm-before -p 'kill window? (y/n)' kill-window" \
  "-#[fg=#7c6f64]──#[fg=#89b482,bold] sessions #[fg=#7c6f64,nobold]──────────────" "" "" \
  "project sessionizer" o "display-popup -E -w 60% -h 60% '$HOME/code/personal/dotfiles/scripts/tmux-sessionizer.sh'" \
  "session picker"      s "display-popup -E -w 35% -h 30% '$HOME/code/personal/dotfiles/scripts/tmux-session-picker.sh'" \
  "window tree"         w "display-popup -E -w 40% -h 40% '$HOME/code/personal/dotfiles/scripts/tmux-tree-picker.sh'" \
  "detach"              d   detach-client \
  "rename session"      "$" "command-prompt -I '#S' 'rename-session %%'" \
  "-#[fg=#7c6f64]──#[fg=#d4be98,bold] config #[fg=#7c6f64,nobold]────────────────" "" "" \
  "theme switcher"      T   "display-popup -E -w 40% -h 40% '$HOME/code/personal/dotfiles/scripts/set-theme.sh'" \
  "reload config"       r   "source-file ~/.tmux.conf ; display-message 'reloaded'" \
  "copy mode"           "[" "copy-mode"

# Session picker (simple) / Window tree picker (indented) / Project sessionizer
bind s display-popup -E -w 35% -h 30% "$HOME/code/personal/dotfiles/scripts/tmux-session-picker.sh"
bind w display-popup -E -w 40% -h 40% "$HOME/code/personal/dotfiles/scripts/tmux-tree-picker.sh"
bind o display-popup -E -w 60% -h 60% "$HOME/code/personal/dotfiles/scripts/tmux-sessionizer.sh"

# Global theme switcher popup (set-theme with no args = fzf picker)
bind T display-popup -E -w 40% -h 40% "$HOME/code/personal/dotfiles/scripts/set-theme.sh"

setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect — save/restore sessions
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-strategy-nvim 'session'

# Continuum — auto-save every 15 min, auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# TPM (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'

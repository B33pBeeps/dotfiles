# ─── Font ────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font ExtraBold
bold_font        JetBrainsMono Nerd Font ExtraBold
italic_font      JetBrainsMono Nerd Font ExtraBold Italic
bold_italic_font JetBrainsMono Nerd Font ExtraBold Italic
font_size        11.0

# ─── Window ──────────────────────────────────────────────────────────
window_padding_width 8 8 0 8
background_opacity   1.0
confirm_os_window_close 0
hide_window_decorations no

# ─── Cursor ──────────────────────────────────────────────────────────
cursor_shape beam
cursor_blink_interval 0.5

# ─── Scrollback ──────────────────────────────────────────────────────
scrollback_lines 10000

# ─── Shell ───────────────────────────────────────────────────────────
shell /usr/bin/zsh --login

# ─── Terminal ────────────────────────────────────────────────────────
term xterm-256color

# ─── Disable kitty tabs/splits (use tmux) ────────────────────────────
enabled_layouts tall
map ctrl+shift+t no_op
map ctrl+shift+enter no_op

# ─── Catppuccin Macchiato ────────────────────────────────────────────
